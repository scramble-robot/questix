joy_gate:
  ros__parameters:
    # Use simulation time
    use_sim_time: false

    # Topic names
    gpio_controllable_topic: "/gpio/controllable"
    joy_input_topic: "/joy"
    joy_output_topic: "/joy_gated"

    # QoS settings
    qos_depth: 10

    # /gpio/controllable 受信タイムアウト[s]、operation_manager 停止で受信が途絶したら
    # uncontrollable にフォールバックしゼロ joy を publish、0以下で無効
    # （安全機能のため通常は無効化しないこと）
    controllable_timeout_sec: 1.0
