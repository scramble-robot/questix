esc_motor_control:
  ros__parameters:
    use_sim_time: false
    joy_topic: "/joy"

    pwm_pin: 13

    min_pulse_width: 0
    max_pulse_width: 2000
    neutral_pulse_width: 1000

    max_speed: 1.0
    min_speed: -1.0

    # Roller spin button / ローラー回転ボタン
    # Switch2 (uart_joy_driver) native index: ZR = 7
    full_speed_button: 7
    full_speed_value: 1.0

    status_topic: "/roller_motor_status"
    # 統一緊急停止トピック（questix_msgs/EmergencyStop, reliable + transient_local, 入力）。
    # active=true 受信で即時停止＋ボタン無視、active=false で解除する
    # （復帰にはフルスピードボタンの再押下が必要）。空文字 "" で連動無効。
    # 発行元は operation_manager（契約: questix_msgs/README.md）。
    emergency_stop_topic: "/emergency_stop"

    # QUESTiX LAB roller input / QUESTiX LAB からのローラー操作
    # accept_lab_input: true のときだけ lab_topic (std_msgs/Float32, 出力割合 0..1) を購読する。
    #   練習用の起動 (questix_core.launch.xml, enable_autoreferee=false) だけが launch 引数で
    #   true にする。競技 (AutoReferee) では常に false。既定値はこの YAML の false。
    #   Subscribed only when true; only practice launches set it (never competition).
    # lab_max_speed: lab の指令はこの値で頭打ち (0..1)。Lab power is clamped to [0, this].
    # lab_joy_quiet_sec: コントローラのローラーボタンを離してからこの秒数は lab を受け付けない。
    #   ボタンを押すと即座にコントローラ優先になり、lab は 0 を送るまでロックされる。
    #   The controller button must be idle this long; a press takes over at once and locks the
    #   lab out until it sends 0.
    # lab の指令が safety_timeout 秒途絶えるとローラーを止める (enable_safety_stop に関係なく)。
    # Lab commands older than safety_timeout stop the roller (even with enable_safety_stop=false).
    # 状態は /roller/status (std_msgs/String, JSON, 5 Hz) に出る。/roller_motor_status はそのまま。
    # Status: /roller/status (JSON, 5 Hz); /roller_motor_status is unchanged.
    accept_lab_input: false
    lab_topic: "/roller/lab"
    lab_max_speed: 0.8
    lab_joy_quiet_sec: 1.0

    # Safety / timeout-stop behavior:
    # If no full-speed command arrives within safety_timeout seconds (e.g. the
    # joy stream drops), the motor is stopped automatically. After a timeout
    # stop the full-speed latch is cleared and the button must be RELEASED and
    # PRESSED AGAIN to restart; holding it down will NOT auto-resume
    # (safety: no motion resumes without a fresh operator press).
    # Set enable_safety_stop=false to disable the timeout stop entirely.
    enable_safety_stop: true
    safety_timeout: 1.0

    test_mode: false
    pwm_backend: "auto"
    gpio_chip_num: 4
