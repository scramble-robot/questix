# The controller's roller button is joy_launcher's (questix_control_config/config/controls.*.yaml,
# joy_launcher section): this node reads /launcher_command only.
esc_motor_control:
  ros__parameters:
    # Use simulation time
    use_sim_time: false

    # questix_msgs/LauncherCommand roller_power (0..1, a level the publisher repeats while in use):
    # joy_launcher in practice and competition, command_arbiter (the controller or QUESTiX LAB) in
    # a lesson. Who may command the roller is decided there, never here. While more than one node
    # publishes it the roller stays at 0 (their levels would mix).
    launcher_command_topic: "/launcher_command"

    # PWM settings
    pwm_pin: 13 # GPIO pin for PWM output

    # ESC pulse width settings (microseconds)
    # speed=0.0 maps to (min+max)/2. With 0/2000, speed=0 → 1000μs (stopped)
    min_pulse_width: 0 # Minimum pulse width (speed=-1.0)
    max_pulse_width: 2000 # Maximum pulse width (speed=1.0)
    neutral_pulse_width: 1000 # ESC arm/idle position (1.0ms = stopped)

    # Motor speed limits
    max_speed: 1.0 # Maximum forward speed (maps to max_pulse_width)
    min_speed: -1.0 # Maximum reverse speed (maps to min_pulse_width)

    # ローラモータのコマンド状態出力先
    # ここには実測回転数ではなく、ESCへ送っている現在の指令値が出ます。
    status_topic: "/roller_motor_status"
    # 統一緊急停止トピック（questix_msgs/EmergencyStop, reliable + transient_local, 入力）。
    # active=true 受信で即時停止＋指令を無視、active=false で解除する
    # （復帰には 0 の指令のあとの新しい指令が必要: ボタンなら離す→押す）。発行元は operation_manager
    # （契約: questix_msgs/README.md。questix_core では常に起動し、GPIO 安全系なしでも
    # "released (no GPIO safety path)" を出す）。一度も受信していない間と、受信後に
    # emergency_stop_timeout_sec 途絶えた間も押下と同じに扱う。
    # require_emergency_stop: false は単体診断の明示 opt-out のみ（統合起動では使わない）。
    emergency_stop_topic: "/emergency_stop"
    require_emergency_stop: true
    emergency_stop_timeout_sec: 1.0
    # 走行許可（L2、/motion_permission の launcher_allowed、reliable + volatile）は非常停止とは
    # 別の概念で、operation_manager の MotionPermissionManager がモードごとの票（大会: 審判 GPIO27、
    # 教材: 先生の許可、練習: なし）をまとめたもの。未受信・motion_permission_timeout_sec の途絶・
    # false の間はローラーを 0 にする（許可が戻ってもボタンの離す→押すが必要）。
    # require_motion_permission: false は単体診断の明示 opt-out のみ（統合起動では使わない）。
    motion_permission_topic: "/motion_permission"
    require_motion_permission: true
    motion_permission_timeout_sec: 0.5

    # 状態は /roller/status (std_msgs/String, JSON, 5 Hz: command, source, estop, permission,
    # max_power) に出る。/roller_motor_status はそのまま。
    # Status: /roller/status (JSON, 5 Hz); /roller_motor_status is unchanged.

    # Safety / timeout-stop behavior (always on):
    # If no /launcher_command arrives within safety_timeout seconds (e.g. the joy stream or the
    # lesson drops), the motor is stopped automatically. After a timeout stop, after the gate
    # closed (motion permission, E-stop) and at start, a non-zero command spins nothing until a
    # 0 has arrived: holding the button down will NOT auto-resume (release and press again).
    safety_timeout: 1.0 # Seconds without command before safety stop

    # Test mode (disables actual GPIO – pure simulation)
    test_mode: false

    # PWM backend: "auto" (try pigpio→lgpio→sim), "pigpio", "lgpio", "simulation"
    pwm_backend: "auto"

    # Only used by explicit rp1_hw. GPIO13 / RP1 PWM0 channel 1; requires guard and manual arm.
    # auto stays legacy for other boards; deploy an explicit reviewed override for ID13.
    rp1_guard_socket: "/run/questix_pwm_guard/control.sock"

    # GPIO chip number for lgpio backend (0 = Pi4, 4 = Pi5)
    gpio_chip_num: 4
