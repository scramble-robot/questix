name: Ansible Playbook Check

on:
    push:
        branches: [main]
        paths:
            - "ansible/**"
            - "scripts/**"
            - "systemd/**"
            - "setup.sh"
            - "setup_dev.sh"
            - ".github/workflows/ansible-check.yaml"
    pull_request:
        branches: [main]
        paths:
            - "ansible/**"
            - "scripts/**"
            - "systemd/**"
            - "setup.sh"
            - "setup_dev.sh"
            - ".github/workflows/ansible-check.yaml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ansible-lint:
        name: Ansible Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ansible and ansible-lint
              run: |
                  python -m pip install --upgrade pip
                  # Pinned for reproducibility; bump deliberately (see AGENTS.md).
                  pip install "ansible==14.2.0" "ansible-lint==26.6.0"

            # Makefile の test-ansible と同じ設定 (.ansible-lint.yml) で実行し、違反は fail させる
            - name: Run ansible-lint
              run: |
                  ansible-lint -c .ansible-lint.yml ansible/playbooks/setup_kit.yaml
                  ansible-lint -c .ansible-lint.yml ansible/playbooks/setup_dev.yaml

    ansible-syntax-check:
        name: Ansible Syntax Check
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  # Pinned for reproducibility; bump deliberately (see AGENTS.md).
                  pip install "ansible==14.2.0"

            - name: Run ansible syntax check
              run: |
                  ansible-playbook ansible/playbooks/setup_kit.yaml --syntax-check -i localhost,
                  ansible-playbook ansible/playbooks/setup_dev.yaml --syntax-check -i localhost,

    ansible-dry-run:
        name: Ansible Dry Run (Check Mode)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  # Pinned for reproducibility; bump deliberately (see AGENTS.md).
                  pip install "ansible==14.2.0"

            - name: Install required system packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    git \
                    software-properties-common \
                    curl \
                    gnupg2

            # check mode はインストーラ系タスクを完走できない既知の制約があるため
            # 参考情報として実行する（AGENTS.md "Ansible check mode limits" を参照）
            - name: Test playbook execution (with tags for minimal test)
              run: |
                  # 軽量なタスクのみを実行してplaybookの基本的な動作を確認
                  ansible-playbook ansible/playbooks/setup_kit.yaml \
                    -i localhost, \
                    --connection=local \
                    --limit localhost \
                    --become \
                    -e "ansible_become_password=dummy" \
                    -e "ansible_python_interpreter=/usr/bin/python3" \
                    --check \
                    --diff
              continue-on-error: true
              env:
                  ANSIBLE_FORCE_COLOR: "1"

    shell-syntax-check:
        name: Shell Script Syntax Check
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run bash -n on shell scripts
              run: |
                  git ls-files -z -- '*.sh' | xargs -0 -r -n1 bash -n

    kitting-contract-tests:
        name: Kitting Resolver + Ansible Contract Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  # Pinned for reproducibility; bump deliberately (see AGENTS.md).
                  pip install "ansible==14.2.0"

            - name: Run ROS_DOMAIN_ID resolver unit tests
              run: python3 -m unittest scripts.test_resolve_ros_domain_id -v

            # Source-only: runs against temp dirs, no become/root, never touches
            # /etc/questix_robot. See ansible/tests/run_contract_tests.sh.
            - name: Run kitting Ansible contract tests
              run: ansible/tests/run_contract_tests.sh

    ansible-validate-inventory:
        name: Validate Ansible Configuration
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  # Pinned for reproducibility; bump deliberately (see AGENTS.md).
                  pip install "ansible==14.2.0"

            - name: Check ansible configuration
              run: |
                  ansible --version
                  ansible-config dump --only-changed || true

            - name: Validate playbook structure
              run: |
                  # Playbookの構造を検証
                  ansible-playbook ansible/playbooks/setup_kit.yaml --list-tasks -i localhost,
                  ansible-playbook ansible/playbooks/setup_kit.yaml --list-hosts -i localhost,
                  ansible-playbook ansible/playbooks/setup_dev.yaml --list-tasks -i localhost,
                  ansible-playbook ansible/playbooks/setup_dev.yaml --list-hosts -i localhost,
