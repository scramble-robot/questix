---
name: Robot Manager Checks

# The ROS 2 build/test workflow ignores "scripts/**", and its static-analysis
# job excludes "./scripts/*" from flake8/pydocstyle, so the FastAPI-based
# robot_manager and other scripts/ Python were never linted or tested in CI.
# These jobs fill that gap: the same flake8/pydocstyle configuration as the ROS
# workflow's static-analysis job scoped to scripts/, robot_manager's pytest
# suite, and the QUESTiX LAB teaching site's Node tests and Prettier check.
# None of them needs ROS, hardware or systemd.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/robot-manager-lint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/robot-manager-lint.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: flake8 + pydocstyle (scripts/)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to keep CI reproducible; bump deliberately (see AGENTS.md).
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install "flake8==7.1.1" "pydocstyle==6.3.0"

      - name: Run flake8 (Python style check)
        run: |
          find scripts -name "*.py" \
            -not -path "*/__pycache__/*" \
            -not -path "*/build/*" \
            -not -path "*/install/*" \
            -not -path "*/log/*" \
            | xargs -r python -m flake8 --select=F --max-line-length=100 --ignore=E501,W503

      - name: Run pydocstyle (Python docstring check)
        run: |
          find scripts -name "*.py" \
            -not -path "*/__pycache__/*" \
            -not -path "*/build/*" \
            -not -path "*/install/*" \
            -not -path "*/log/*" \
            | xargs -r python -m pydocstyle --ignore=D100,D101,D102,D103,D104,D105,D107,D203,D213,D400,D415

  python-tests:
    name: robot_manager pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install robot_manager and pytest
        run: python -m pip install ./scripts "pytest==8.3.3"

      # The lab console only builds the bridge command; nothing is started.
      - name: Run pytest
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q scripts/robot_manager

  lab-tests:
    name: QUESTiX LAB tests + Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/robot_manager/static/lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # the version the lab tests are developed on

      # Tests that compare against a pre-refactor copy of the site skip
      # themselves here because LAB_BASELINE is not set.
      - name: Run Node tests
        run: node --test test/*.test.mjs

      # The site has no package.json (no build step), so Prettier is pinned
      # here; CONTRIBUTING.md makes its formatting mandatory.
      - name: Check formatting with Prettier
        run: npx --yes prettier@3.9.8 --check .
