<p>肩の角度を θ₁（シータ1）、肘の角度を θ₂ とします。2本目の棒の向きは θ₁+θ₂ です。</p><p class="arm-equation">x = 160 cos θ₁ + 130 cos(θ₁+θ₂)<br>z = 160 sin θ₁ + 130 sin(θ₁+θ₂)</p><p>cos（コサイン）は横方向、sin（サイン）は縦方向に長さを分けるときに使います。θ₁ が90°を超えたり負になったりしても同じ式が使えます（例：cos(−30°)＝cos30°、cos120°＝−0.5）。式の暗記から始めず、横・上・直角の3つの姿勢で、図と計算結果が合うか見てください。</p>
