<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>QUESTiX Web Joy</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181c24; --line: #2a3140; --fg: #e6e9ef; --dim: #8b94a7;
    --ok: #35c46a; --warn: #f4b942; --bad: #ff4d4f; --accent: #4c8dff;
    --stick: rgba(255,255,255,0.10); --knob: rgba(255,255,255,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; overflow: hidden;
  }
  #app {
    height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Explicit rows: #banner is display:none when empty and must not shift main/footer. */
  header { grid-row: 1; }
  #banner { grid-row: 2; }
  #controls { grid-row: 3; }
  main { grid-row: 4; }
  footer { grid-row: 5; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); min-height: 40px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  header .host { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 12px; white-space: nowrap;
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.ok::before { background: var(--ok); }
  .pill.warn::before { background: var(--warn); }
  .pill.bad::before { background: var(--bad); }
  button.icon {
    background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; font-size: 13px; touch-action: manipulation;
  }
  #banner {
    display: none; padding: 8px 12px; text-align: center; font-weight: 700; letter-spacing: .04em;
  }
  #banner.bad { display: block; background: var(--bad); color: #fff; }
  #banner.warn { display: block; background: var(--warn); color: #201700; }
  #banner.info { display: block; background: var(--accent); color: #fff; }
  #banner .sub { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
  main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .zone { position: relative; overflow: hidden; }
  .zone.left { border-right: 1px solid var(--line); }
  .zone .hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--dim); font-size: 12px; text-align: center; pointer-events: none;
  }
  .zone.right { display: grid; grid-template-rows: auto 1fr; }
  .buttons {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px;
  }
  .btn {
    position: relative; height: 64px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--panel); color: var(--fg); font-size: 16px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: none;
  }
  .btn span, .btn small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn small { font-size: 11px; font-weight: 400; color: var(--dim); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.fire.active { background: var(--bad); border-color: var(--bad); }
  .btn.fire { border-color: #6b2a2c; }
  .stickpad { position: relative; min-height: 120px; }
  .stick { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
    background: var(--stick); border: 1px solid var(--line); display: none; pointer-events: none; }
  .knob { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: var(--knob); left: 50%; top: 50%; }
  .stick.on { display: block; }
  footer {
    display: flex; align-items: center; gap: 12px; padding: 4px 10px; border-top: 1px solid var(--line);
    background: var(--panel); color: var(--dim); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden;
  }
  footer span { overflow: hidden; text-overflow: ellipsis; }
  #reconnect { display: none; }
  #controls { padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #controls label { display: inline-flex; align-items: center; gap: 8px; }
  #inputMode { background: var(--bg); color: var(--fg); padding: 5px; border: 1px solid var(--line); border-radius: 6px; }
  #inputHelp { margin: 5px 0 0; color: var(--dim); font-size: 12px; }
  #stop { margin-left: 8px; border-color: var(--bad); }
  .keyboard .zone { opacity: .65; }
  @media (max-height: 480px) and (orientation: landscape) {
    .buttons { padding: 6px; gap: 6px; }
    .btn { height: 42px; font-size: 14px; }
    .stickpad { min-height: 60px; }
  }
  @media (orientation: portrait) {
    /* Top half: buttons + rotation stick, bottom half: drive stick. */
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .zone.left { border-right: 0; border-top: 1px solid var(--line); order: 2; }
    .zone.right { order: 1; }
    .buttons { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .btn { height: 56px; font-size: 14px; }
  }
  @media (max-width: 520px) {
    header { gap: 6px; padding: 6px 8px; }
    header .host { display: none; }
    .pill { padding: 3px 7px; font-size: 11px; }
    button.icon { padding: 4px 7px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>QUESTiX Web Joy</h1>
    <span class="host" id="host"></span>
    <div class="spacer"></div>
    <span class="pill" id="estop">E-stop: --</span>
    <span class="pill" id="conn">未接続</span>
    <button class="icon" id="reconnect">再接続</button>
    <button class="icon" id="fullscreen" title="全画面" aria-label="全画面">⛶</button>
  </header>
  <div id="banner"></div>
  <div id="controls">
    <label for="inputMode">操作方法
      <select id="inputMode">
        <option value="pointer">タッチ・マウス</option>
        <option value="keyboard">キーボード</option>
      </select>
    </label>
    <button class="icon" id="stop" title="この端末の入力をすべて解除">入力を解除 (Esc)</button>
    <p id="inputHelp">スティックをドラッグ、ボタンは押している間だけ操作します。アプリのインストールは不要です。</p>
  </div>
  <main>
    <section class="zone left" id="leftZone">
      <div class="hint">左スティック<br>前後・左右移動</div>
      <div class="stick" id="leftStick"><div class="knob"></div></div>
    </section>
    <section class="zone right">
      <div class="buttons" id="buttons"></div>
      <div class="stickpad" id="rightZone">
        <div class="hint">右スティック<br>旋回</div>
        <div class="stick" id="rightStick"><div class="knob"></div></div>
      </div>
    </section>
  </main>
  <footer>
    <span id="dbgAxes">axes --</span>
    <span id="dbgButtons">btn --</span>
    <span id="dbgStat"></span>
  </footer>
</div>
<script>
(() => {
  "use strict";
  // ----------------------------------------------------------------------
  // Layout: Switch2-native indices (same as uart_joy_driver), so the
  // *.uart.yaml profiles of shot_component / esc_motor_control apply.
  //   buttons: A=0 B=1 X=2 Y=3 L=4 R=5 ZL=6 ZR=7 Minus=8 Plus=9 Home=10 Capture=11 LStick=12 RStick=13
  //   axes:    LX=0 LY=1 RX=3 RY=4 DpadH=6 DpadV=7   (left / up = +1)
  // ----------------------------------------------------------------------
  const NUM_AXES = 8, NUM_BUTTONS = 14;
  const LAYOUT = {
    leftStick: { x: 0, y: 1 },
    rightStick: { x: 3, y: 4 },
    buttons: [
      { index: 4, label: "TILT ▲", sub: "L" },
      { index: 5, label: "FIRE", sub: "R", cls: "fire" },
      { index: 6, label: "TILT ▼", sub: "ZL" },
      { index: 7, label: "ROLLER", sub: "ZR (hold)" },
    ],
  };
  const STICK_RADIUS = 60;         // px of travel for full deflection
  const HEARTBEAT_MS = 100;        // resend the current state at least this often
  const RECONNECT_MIN_MS = 500, RECONNECT_MAX_MS = 5000;

  const axes = new Array(NUM_AXES).fill(0);
  const buttons = new Array(NUM_BUTTONS).fill(0);
  const heldKeys = new Set();
  let focused = document.hasFocus();
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get("token") || "";
  $("host").textContent = location.host;

  // ---------------------------------------------------------------- transport
  let ws = null, released = false, reconnectDelay = RECONNECT_MIN_MS, reconnectTimer = null;
  let dirty = false, rafPending = false;
  function canInput() {
    return focused && !document.hidden && !released && ws && ws.readyState === WebSocket.OPEN;
  }

  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const q = token ? "?token=" + encodeURIComponent(token) : "";
    return `${proto}://${location.host}/ws${q}`;
  }
  function setConn(cls, text) { const el = $("conn"); el.className = "pill " + cls; el.textContent = text; }
  function setBanner(cls, text, sub) {
    const el = $("banner");
    if (!cls) { el.className = ""; el.textContent = ""; return; }
    el.className = cls; el.textContent = text;
    if (sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = sub; el.appendChild(s); }
  }
  function sendNow() {
    dirty = false;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "joy", axes, buttons }));
  }
  function markDirty() {
    dirty = true;
    renderDebug();
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; if (dirty) sendNow(); });
  }
  function connect() {
    clearTimeout(reconnectTimer);
    if (document.hidden) return;
    resetAll();
    if (ws) ws.close();
    released = false;
    $("reconnect").style.display = "none";
    setConn("warn", "接続中…");
    const socket = new WebSocket(wsUrl());
    ws = socket;
    socket.onopen = () => {
      if (ws !== socket) return;
      resetAll(); reconnectDelay = RECONNECT_MIN_MS; setConn("ok", "接続"); setBanner("");
    };
    socket.onmessage = (ev) => {
      if (ws !== socket) return;
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "status") onStatus(msg);
      else if (msg.type === "released") { released = true; resetAll(); setBanner("warn", "他の端末が操作を引き継ぎました", "この端末で操作するには「再接続」を押してください"); }
    };
    socket.onclose = (ev) => {
      if (ws !== socket) return;
      ws = null;
      resetAll();
      if (ev.code === 4000) released = true;
      if (released) { setConn("bad", "切断（引き継ぎ）"); $("reconnect").style.display = ""; return; }
      if (ev.code === 1008 || ev.code === 4401) { released = true; setConn("bad", "認証エラー"); setBanner("bad", "トークンが違います"); $("reconnect").style.display = ""; return; }
      setConn("bad", "切断 / 再接続待ち");
      setBanner("warn", "ロボットとの接続が切れました", "ロボット側は自動でニュートラルに戻ります");
      if (!document.hidden) reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(RECONNECT_MAX_MS, reconnectDelay * 2);
    };
    socket.onerror = () => { /* onclose follows */ };
  }
  $("reconnect").addEventListener("click", () => { clearTimeout(reconnectTimer); connect(); });
  setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) sendNow(); }, HEARTBEAT_MS);

  function onStatus(s) {
    const e = $("estop");
    if (s.estop === true) {
      e.className = "pill bad"; e.textContent = "E-stop: 停止中";
      setBanner("bad", "非常停止中", s.estop_reason || "");
    } else if (s.estop === false) {
      e.className = "pill ok"; e.textContent = "E-stop: 解除";
      if ($("banner").className === "bad") setBanner("");
    } else {
      e.className = "pill"; e.textContent = "E-stop: 情報なし";
    }
    const hold = { active: "送信中", timeout: "タイムアウト→ニュートラル", released: "フレーム未受信" }[s.hold] || s.hold;
    $("dbgStat").textContent = `${hold} age=${s.rx_age_ms ?? "-"}ms clients=${s.clients} ${s.controller ? "" : "(閲覧のみ)"}`;
    if (s.hold === "timeout" && s.controller) setConn("warn", "接続 (フレーム遅延)");
    else if (s.controller && ws && ws.readyState === WebSocket.OPEN) setConn("ok", "接続");
  }

  // ---------------------------------------------------------------- sticks
  function makeStick(zoneEl, stickEl, map) {
    const knob = stickEl.querySelector(".knob");
    let pointerId = null, ox = 0, oy = 0;
    const zoneRect = () => zoneEl.getBoundingClientRect();
    function set(dx, dy) {
      const len = Math.hypot(dx, dy);
      if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      // ROS joy convention: left = +1 (X), up = +1 (Y).
      axes[map.x] = +(-dx / STICK_RADIUS).toFixed(3);
      axes[map.y] = +(-dy / STICK_RADIUS).toFixed(3);
      markDirty();
    }
    function release() {
      pointerId = null; stickEl.classList.remove("on"); knob.style.transform = "";
      axes[map.x] = 0; axes[map.y] = 0; markDirty();
    }
    zoneEl.addEventListener("pointerdown", (ev) => {
      if (!canInput() || $("inputMode").value !== "pointer" || ev.button !== 0) return;
      if (pointerId !== null) return;
      pointerId = ev.pointerId;
      zoneEl.setPointerCapture(ev.pointerId);
      const r = zoneRect();
      ox = ev.clientX - r.left; oy = ev.clientY - r.top;
      stickEl.style.left = ox + "px"; stickEl.style.top = oy + "px";
      stickEl.classList.add("on");
      set(0, 0);
      ev.preventDefault();
    });
    zoneEl.addEventListener("pointermove", (ev) => {
      if (ev.pointerId !== pointerId) return;
      const r = zoneRect();
      set(ev.clientX - r.left - ox, ev.clientY - r.top - oy);
      ev.preventDefault();
    });
    for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) {
      zoneEl.addEventListener(t, (ev) => { if (ev.pointerId === pointerId) release(); });
    }
    return { release };
  }
  const sticks = [
    makeStick($("leftZone"), $("leftStick"), LAYOUT.leftStick),
    makeStick($("rightZone"), $("rightStick"), LAYOUT.rightStick),
  ];

  // ---------------------------------------------------------------- buttons
  const buttonEls = [];
  for (const b of LAYOUT.buttons) {
    const el = document.createElement("div");
    el.className = "btn " + (b.cls || "");
    el.innerHTML = `<span></span><small></small>`;
    el.firstChild.textContent = b.label; el.lastChild.textContent = b.sub;
    let pointerId = null;
    const press = (on) => { buttons[b.index] = on ? 1 : 0; el.classList.toggle("active", on); markDirty(); };
    el.addEventListener("pointerdown", (ev) => {
      if (!canInput() || $("inputMode").value !== "pointer" || ev.button !== 0) return;
      if (pointerId !== null) return;
      pointerId = ev.pointerId; el.setPointerCapture(ev.pointerId); press(true); ev.preventDefault();
    });
    for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) {
      el.addEventListener(t, (ev) => { if (ev.pointerId === pointerId) { pointerId = null; press(false); } });
    }
    el.release = () => { pointerId = null; press(false); };
    $("buttons").appendChild(el);
    buttonEls.push(el);
  }

  // ---------------------------------------------------------------- keyboard
  // Space must be pressed before action keys. Releasing it clears every key,
  // so OS key repeat cannot revive an input after blur, stop or reconnect.
  const KEY_BUTTONS = { KeyI: 4, KeyF: 5, KeyK: 6, KeyR: 7 };
  const CONTROL_KEYS = new Set([
    "Space", "KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight",
    "KeyQ", "KeyE", ...Object.keys(KEY_BUTTONS),
  ]);
  function renderKeyboard() {
    const down = (...codes) => codes.some((code) => heldKeys.has(code)) ? 1 : 0;
    let x = down("KeyA", "ArrowLeft") - down("KeyD", "ArrowRight");
    let y = down("KeyW", "ArrowUp") - down("KeyS", "ArrowDown");
    const length = Math.max(1, Math.hypot(x, y));
    axes[LAYOUT.leftStick.x] = +(x / length).toFixed(3);
    axes[LAYOUT.leftStick.y] = +(y / length).toFixed(3);
    axes[LAYOUT.rightStick.x] = down("KeyQ") - down("KeyE");
    for (const [code, index] of Object.entries(KEY_BUTTONS)) buttons[index] = down(code);
    buttonEls.forEach((el, i) => el.classList.toggle("active", !!buttons[LAYOUT.buttons[i].index]));
    markDirty();
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.code === "Escape") { resetAll(); return; }
    if (ev.ctrlKey || ev.altKey || ev.metaKey) { resetAll(); return; }
    if (ev.isComposing || !canInput() || $("inputMode").value !== "keyboard") return;
    if (ev.target.closest("input, select, textarea, button, a, [contenteditable]")) return;
    if (!CONTROL_KEYS.has(ev.code)) return;
    ev.preventDefault();
    if (ev.repeat || (ev.code !== "Space" && !heldKeys.has("Space"))) return;
    heldKeys.add(ev.code);
    renderKeyboard();
  });
  document.addEventListener("keyup", (ev) => {
    if (!heldKeys.has(ev.code)) return;
    ev.preventDefault();
    if (ev.code === "Space") { resetAll(); return; }
    heldKeys.delete(ev.code);
    renderKeyboard();
  });
  $("inputMode").addEventListener("change", () => {
    resetAll();
    const keyboard = $("inputMode").value === "keyboard";
    $("app").classList.toggle("keyboard", keyboard);
    $("inputHelp").textContent = keyboard
      ? "Space を先に押して保持 → WASD / 矢印: 移動・Q/E: 旋回・I/K: TILT・F: FIRE・R: ROLLER。Space を離すと入力解除。"
      : "スティックをドラッグ、ボタンは押している間だけ操作します。アプリのインストールは不要です。";
    $("inputMode").blur();
  });
  $("stop").addEventListener("click", () => { resetAll(); $("stop").blur(); });

  // ---------------------------------------------------------------- safety
  function resetAll() {
    heldKeys.clear();
    for (const s of sticks) s.release();
    for (const el of buttonEls) el.release();
    axes.fill(0); buttons.fill(0);
    sendNow();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) resetAll();
    else {
      resetAll(); requestWakeLock();
      if (!ws && !released) connect();
    }
  });
  window.addEventListener("pagehide", resetAll);
  window.addEventListener("blur", () => { focused = false; resetAll(); });
  window.addEventListener("focus", () => { focused = true; resetAll(); });
  document.addEventListener("contextmenu", (ev) => ev.preventDefault());

  // ---------------------------------------------------------------- misc
  let wakeLock = null;
  async function requestWakeLock() {
    if (!("wakeLock" in navigator) || document.hidden || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener("pointerdown", () => { if (!wakeLock) requestWakeLock(); }, { once: false });

  const fsBtn = $("fullscreen");
  if (!document.documentElement.requestFullscreen) fsBtn.style.display = "none";
  fsBtn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  function renderDebug() {
    $("dbgAxes").textContent = "axes " + axes.map((v) => v.toFixed(2)).join(" ");
    $("dbgButtons").textContent = "btn " + buttons.join("");
  }
  renderDebug();
  connect();
})();
</script>
</body>
</html>
