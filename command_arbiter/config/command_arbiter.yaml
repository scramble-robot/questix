# command_arbiter (lesson launches only, questix_core robot_mode:=lesson): which input reaches the
# drive and the launcher, the controller or a QUESTiX LAB run. Rule:
# include/command_arbiter/source_selector.hpp. The arbiter never looks at the E-stop or the motion
# permission: the actuators stop on /emergency_stop and /motion_permission themselves.
drive_arbiter:
  ros__parameters:
    joy_topic: "/target_twist/joy"   # joy_controller's output, remapped by the lesson launch
    lab_topic: "/target_twist/lab"   # questix_lab_bridge drive_topic
    output_topic: "/target_twist"    # drive_component's input
    status_topic: "/command_arbiter/status"
    # The teacher's lesson permission (Robot Manager's heartbeat, drive_allowed), a 1.0 s lease.
    lab_permission_topic: "/lab_permission"
    lab_permission_lease_sec: 1.0
    # QUESTiX LAB's speed caps: faster lab commands are clamped (learners run these experiments
    # next to the robot). The lab bridge shows them to the pages from /command_arbiter/status.
    lab_max_linear: 0.15  # [m/s]
    lab_max_angular: 0.5  # [rad/s]
    # A stick command below these counts as neutral: the lab may take over, and small noise on a
    # resting stick does not take the robot back. Anything above hands it to the controller.
    neutral_linear: 0.01    # [m/s]
    neutral_angular: 0.025  # [rad/s]
    # The drive needs no quiet time: the lab may take over as soon as the stick is neutral.
    controller_quiet_sec: 0.0
    # No controller command this long = no controller: the lab may take over.
    joy_timeout_sec: 0.5
    # The lab input quiet this long = its run ended: a stop, then the controller again.
    lab_timeout_sec: 0.3
    tick_hz: 20.0
    status_hz: 5.0
