[Unit]
# Ordering only (no Wants=): at shutdown the manager stops first, so recordings and the
# evidence's post-run parameters finish while the robot nodes are still up.
After=questix_robot.service

[Service]
# systemd creates /var/lib/questix/rosbags owned by User=; the parent is not changed.
StateDirectory=questix/rosbags
StateDirectoryMode=0750
# SIGTERM only to the manager; ros2 bag record gets SIGINT from the manager's shutdown
# (recorder.shutdown_recording) so metadata.yaml and the MCAP footer are written.
KillMode=mixed
# > STOP_TIMEOUT_SEC + 5 + SHUTDOWN_FINALIZE_TIMEOUT_SEC (recorder.py); test_* keeps them in step.
TimeoutStopSec=150
