# NOTE: このファイルが drive_component の設定の単一ソース（Single Source of Truth）です。
# 統合起動（questix_launcher）ではこの launcher/config が params-file として渡されます。
# 以前 motor_control_app/config にあった重複コピーは廃止しました。
# motor_control_app 単体launch は config_file 引数を省略すると drive_component ノードの宣言
# デフォルト（drive_component.cpp の declare_parameter）で起動します。宣言デフォルトはこの yaml の
# 値と同値に保っているため、単体launch も同じ挙動になります。単体launch でこの yaml を使いたい
# 場合は config_file:=<path> を渡してください。
# 設定を変更する場合はこの1箇所を編集してください（統合起動に反映）。単体launch のデフォルトも
# 変えたい場合は drive_component.cpp の declare_parameter を同じ値に合わせてください。
# 変更が実際にノードへ届いているかは `ros2 param dump /drive_component` で確認できます。
drive_component:
  ros__parameters:
    # シリアル通信設定
    serial_port: "/dev/ttyACM0"
    baud_rate: 57600

    # Lifecycle auto start / ライフサイクル自動起動
    # 非常停止中はモータが通電されず接続できないため、unconfigured で待機し
    # connect_retry_period_sec 間隔で接続を再試行、成功したら自動で activate する。
    # false にすると ros2 lifecycle set で手動遷移する運用になる。
    auto_start: true
    connect_retry_period_sec: 1.0

    # ロボット物理パラメータ
    wheel_radius: 0.1 # ホイール半径 [m]
    wheel_separation: 0.5 # ホイール間隔 [m]

    # モータ設定
    left_motor_id: 4 # 左モータID
    right_motor_id: 5 # 右モータID
    # 走行モータの上限回転数
    # 値を下げるとロボット全体の最高速度が下がります。組立直後の安全確認では低めを推奨します。
    # M0602C の速度ループ指令範囲は ±475 rpm（仕様）。475 を超える値はライブラリ側で
    # 475 にクランプされます（範囲外指令はファーム挙動が未定義のため）。
    max_motor_rpm: 475 # 最大RPM

    # 制御モード設定
    # "velocity": M0602Cファーム内蔵の速度ループを使用（従来挙動）
    # "current" : ソフトウェアPI制御で目標RPM→電流指令に変換（精密操縦向け）
    control_mode: "velocity"
    current_kp: 0.001           # [A/rpm]   比例ゲイン
    current_ki: 0.0             # [A/(rpm·s)] 積分ゲイン（1次調整は純Pで始める）
    max_current_amp: 1.0        # [A] 電流指令の絶対値上限（安全クランプ）
    integral_limit_amp: 0.3     # [A] 積分項寄与の絶対値上限（アンチワインドアップ）
    current_zero_deadband_rpm: 5  # [RPM] 目標0かつ実測がこの範囲内ならPIを停止して積分リセット（静止時の微振動防止）
    current_invert_measured: true # PI内でmeasured RPMを符号反転（指令と測定の物理符号が逆=正帰還になっている場合のみtrue）

    # 加速度クランプ（スルーレート制限）。0 以下で無効。
    # スティック満倒からの起動トルクを抑え、急加速感をやわらげる。
    max_linear_accel: 3.0    # [m/s^2] 線形加速度の上限
    max_angular_accel: 3.0   # [rad/s^2] 角加速度の上限（低め＝角速度指令の実効ローパス。スティックノイズを平滑化し低RPMファームループの励起を抑える）

    # デマンド適応加速度（スティックの倒し方で加速度を変える）。
    # 目的: joy_controller が出す target_twist を一定加速度で追う従来方式では、スティックを
    # わずかに/ゆっくり倒しても max_*_accel で急に加速し、ジャークがきつく速度が追従しにくい。
    # これを有効にすると、加速度上限を「デマンド（残差 = |目標 - 前回指令|）」に応じて
    # min_*_accel..max_*_accel の範囲で線形補間する:
    #   - スティックを速く/大きく倒す → 残差が大きい → 加速度は max 側（きつい）
    #   - スティックをゆっくり/わずかに倒す → 残差が小さいまま → 加速度は min 側（ゆるやか）
    # accel_demand_ref_* は加速度が max に達する残差の基準値[指令と同単位]。残差 >= ref で max。
    # 無効化: min_*_accel <= 0 または accel_demand_ref_* <= 0 のとき max_*_accel の一定クランプ
    #（従来挙動）になる。実機では min を max の 1/5〜1/3、ref を常用最高速の 1/3〜1/2 程度から調整。
    min_linear_accel: 0.5           # [m/s^2] ゆっくり倒したときの加速度上限（0 で適応無効）
    min_angular_accel: 0.15         # [rad/s^2] ゆっくり倒したときの角加速度上限（0 で適応無効。低め＝微小入力のジッタをより強くローパス）
    accel_demand_ref_linear: 0.3    # [m/s] この残差で線形加速度が max に達する（0 で適応無効）
    accel_demand_ref_angular: 0.5   # [rad/s] この残差で角加速度が max に達する（0 で適応無効。大きめ＝小さな旋回入力を min 側に留めて平滑化）

    # 目標接近時のレート絞り幅（実効的なジャーク制限）。0 以下で無効＝従来の一次レート制限。
    # 残差 |目標 - 前回指令| がこの幅に入ると 1 ステップの上限を残差に比例して縮め、目標へ
    # 漸近的に到達させる。一次のレート制限だけだと、スティック満倒で目標が飽和した瞬間に
    # 加速度が max_*_accel から 0 へステップで落ち、追従遅れが溜まった M0602C ファーム
    # 速度ループがオーバーシュート→引き戻し（一旦減速して再加速）を起こす。
    # 残差の時定数は band / max_*_accel [s]。旋回は低RPMでファーム速度ループが不安定なため、
    # band を広くとって目標到達を緩やかにするほど、到達直後のオーバーシュート振動が減る。
    # 幅を 1 ステップ分（max_*_accel × 制御周期 1/control_rate）より十分大きく取らないと効かない。
    # 加速側・減速側の両方に対称に効く。減速側では min_command_rpm の不感帯が
    # 残った微小指令を停止に丸めるため、停止までの遅れにはならない。
    slew_taper_band_linear: 0.2    # [m/s] 0 で無効
    slew_taper_band_angular: 0.2    # [rad/s] 0 で無効。旋回の目標到達を緩やかにし低RPMファームループの振動を抑える主レバー

    # 停止時の電気ブレーキ（velocity モードのみ有効）。
    # true: スティック中立/停止時に目標0＋ブレーキ指令を送り、しっかり停止・保持する。
    # 惰性で緩やかに減速して止まりにくい場合に有効。false で従来挙動（目標0のみ）。
    brake_on_stop: false

    # ファーム側加速時間（Protocol 1 の DATA[6]、velocity モードのみ有効）。
    # 単位は 0.1 ms/rpm（M0602C 仕様）。1 rpm の目標変化あたりのランプ時間。
    # 例: 50 -> 5 ms/rpm（100 rpm のステップを 0.5 s かけてランプ）。
    # ホスト側スルーレート制限（max_*_accel）が生む階段状の目標変化をファームが補間する
    # 平滑化機構。小さすぎると各ステップがほぼステップ入力になり加減速中の微振動の原因に
    # なる。1..255 にクランプ。実機で 30..100 を目安に調整する。
    #
    # 重要: ホスト側スルーレート制限とファーム側 accel_time は加速プロファイルを二重に
    # 持っている。傾きが緩い（ms/rpm が大きい）側が実効的に支配するため、ファーム側の
    # 平滑化を効かせたいならこの値［ms/rpm］はホスト側換算値より十分小さくする。
    #   ホスト側換算 ms/rpm = 1000 / (max_linear_accel × 60 / (2π × wheel_radius))
    #   既定値（max_linear_accel 1.0, wheel_radius 0.1）→ 95.5 rpm/s ≒ 10.5 ms/rpm
    # つまり既定では 100（= 10 ms/rpm）でもホスト側とほぼ同じ傾きで、ファームがほとんど
    # 平滑化していない。どちらが支配的かは on_configure の起動ログに
    # 「host slew equivalent: ... -> 加速プロファイル支配側: ...」として出る。
    #
    # 注: この値は左右両モータ共通の単一ファームパラメータで、前後と旋回で別々にはできない。
    # 実機検証では 1 より大きくすると高RPMの直進が乱れたため 1（実質ファーム平滑化なし）に固定する。
    # 旋回（低RPM）の振動はこの値ではなく slew_taper_band_angular / max_angular_accel 側で押さえる。
    accel_time_0p1ms_per_rpm: 1

    # 指令を許す最低車輪RPM（低速不感帯）。左右輪の指令RPMがいずれもこの値未満なら停止扱い。
    # M0602Cのファーム速度ループは低速域ほど減衰が悪く、わずかな速度を保持させようとすると
    # 収束せず振動し続ける（実機ログ: 目標95RPM一定で実測59〜118RPMを約1.8Hzで往復、
    # 低速側はさらに悪化）。その領域を指令しないための不感帯。0で無効。
    # 換算: 1 RPM ≒ 0.0105 m/s（wheel_radius 0.1）。8 RPM ≒ 0.084 m/s。
    # 注意: 旋回のみの指令では車輪RPMは最大でも angular_z × wheel_separation/2 相当
    # （angular_input_ratio 1.0 なら約24RPM）しか出ないため、上げすぎると旋回の低速側が
    # 丸ごと使えなくなる。実機で 5〜15 を目安に調整する。
    min_command_rpm: 5

    # /target_twist 受信タイムアウト（制御 tick 内で判定）。
    # 指令がこの秒数途絶えたら走行モータを停止する（velocity/current 両モードで有効）。
    # 上流（uart_joy_driver/joy_gate/joy_controller）が停止しても暴走を防ぐ安全機能。
    # 0以下で無効（安全機能のため通常は無効化しないこと）。
    cmd_timeout_sec: 1.0

    # 制御ループ（制御 tick）の周期 [Hz]。twist の受信（保存のみ）と制御実行は分離されて
    # おり、スルーレート制限の dt は 1/control_rate の定数になる。これにより加速度
    # プロファイルが上流の publish レート（DualShock 20Hz / UART 50Hz）に依存しない。
    # シリアル送信もこの tick のみが行う（指令+フィードバック往復: 2モータで正常 ≈ 7ms、
    # フィードバック落ち時は最悪 ≈ 20ms）。往復時間が周期予算 1/control_rate を超えると
    # "Control tick overrun" 警告が出る。その場合は control_rate を下げる。
    control_rate: 50.0

    # 指令送信後の追加待機 [ms]。0で待機なし（既定）。
    # 応答待ち（最大10ms）が自然なコマンド間隔になるため通常は不要。
    # DDT M0602C の最小コマンド間隔が実機検証で必要と判明した場合のみ >0 を設定する。
    # 注意: >0 にするとその分コールバックがブロックされる。
    command_wait_ms: 0

    # 停止継続中のブレーキ再送間隔 [ms]。停止指令（目標0+ブレーキ）が既に送信済みの状態が
    # 続く間、この間隔未満での再呼び出しは実際のシリアル送信をスキップする。
    # 高頻度（~20Hz）でブレーキを再送し続けると、残留回転がある間は毎回新規の制動として
    # 作用し、収束せず持続的な振動（リミットサイクル）を起こすことがある
    # （cf. 停止直後の足回り振動の rosbag 解析）。0で無効（従来通り毎回送信）。
    # 停止直後の最初の1回、および緊急停止には適用されない（常に即座に送信する）。
    # 注: 制御 tick 導入後、0 のままだと停止再送は control_rate（50Hz）で走る。
    # 停止直後の振動が見られる場合は実機で 0 / 200 の A/B を行うこと。
    stop_resend_interval_ms: 0

    # 実測RPMのローパスフィルタ時定数 [s]。M0602Cのフィードバック速度は量子化・振動で
    # ノイズが大きい（実機ログ: 目標一定でも実測が約1.8Hzで往復）。この値を >0 にすると
    # レポート／オドメトリ経路で使う実測RPMを一次ローパスで平滑化する。
    # 一次ローパス: filtered += dt/(tau+dt) * (raw - filtered)（可変サンプル間隔対応）。
    # 遮断周波数の目安 fc ≒ 1/(2π·tau) [Hz]。例: 0.1 -> 約1.6Hz、0.2 -> 約0.8Hz。
    # tau を大きくするほどノイズは減るが位相遅れ（応答遅れ）が増え、オドメトリの
    # 積分タイミングも遅れる。実機で 0.05〜0.2 を目安に調整する。0以下で無効（生値）。
    # 注意: このフィルタは制御ループには掛からない。current モードの PI 制御は生の実測RPMを
    # 使い続けるため、制御の位相余裕は変わらない（平滑化はレポート／オドメトリ側のみ）。
    # /drive_status の velocity_rpm と /odom の twist に反映される。
    measured_lpf_tau_sec: 0.15

    # パブリッシュ設定
    status_publish_rate: 50.0 # ステータスパブリッシュ頻度 [Hz]
    # 型付きステータス出力先（questix_msgs/DriveStatus）。契約は questix_msgs/README.md。
    # 左右モータの電流/速度/位置/fault を型付きで確認したいときはこちらを echo してください。
    typed_status_topic: "/drive_status"

    # オドメトリ出力（実測RPM由来の twist を積分し status_publish_rate 周期で publish）。
    # フィードバックが 0.5 秒以上更新されない間（非常停止・未通電を含む）は積分を止め、
    # ポーズ固定・twist ゼロで publish を継続する。
    # publish_tf: 外部 localization が odom->base_link を出す場合は false にする
    publish_tf: true
    odom_topic: "/odom"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 統一緊急停止トピック（questix_msgs/EmergencyStop, reliable + transient_local）。
    # active=true 受信で即時停止＋twist 無視、active=false で twist 受付を再開する
    # （モータは次の指令まで停止のまま）。空文字 "" で連動無効。
    # 発行元は operation_manager（契約: questix_msgs/README.md）。
    emergency_stop_topic: "/emergency_stop"
