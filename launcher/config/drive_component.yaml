# QUESTiX drive hardware/control-loop configuration (single source).
# Operator tuning (RPM limits, acceleration, taper, deadband) is in
# questix_control_config/config/controls.*.yaml, shared with robot_manager.
# Integrated launch loads this file, then the operator profile.
# Standalone launch accepts this file via config_file; without it hardware
# parameters retain node defaults. Shared operator controls still apply.
drive_component:
  ros__parameters:
    # シリアル通信設定
    serial_port: "/dev/ttyACM0"
    baud_rate: 57600

    # Lifecycle auto start / ライフサイクル自動起動
    # 非常停止中はモータが通電されず接続できないため、unconfigured で待機し
    # connect_retry_period_sec 間隔で接続を再試行、成功したら自動で activate する。
    # false にすると ros2 lifecycle set で手動遷移する運用になる。
    auto_start: true
    connect_retry_period_sec: 1.0

    # ロボット物理パラメータ
    wheel_radius: 0.1 # ホイール半径 [m]
    wheel_separation: 0.5 # ホイール間隔 [m]

    # モータ設定
    left_motor_id: 4 # 左モータID
    right_motor_id: 5 # 右モータID
    # 制御モード設定
    # "velocity": M0602Cファーム内蔵の速度ループを使用（従来挙動）
    # "current" : ソフトウェアPI制御で目標RPM→電流指令に変換（精密操縦向け）
    control_mode: "velocity"
    current_kp: 0.001           # [A/rpm]   比例ゲイン
    current_ki: 0.0             # [A/(rpm·s)] 積分ゲイン（1次調整は純Pで始める）
    max_current_amp: 1.0        # [A] 電流指令の絶対値上限（安全クランプ）
    integral_limit_amp: 0.3     # [A] 積分項寄与の絶対値上限（アンチワインドアップ）
    current_zero_deadband_rpm: 5  # [RPM] 目標0かつ実測がこの範囲内ならPIを停止して積分リセット（静止時の微振動防止）
    current_invert_measured: true # PI内でmeasured RPMを符号反転（指令と測定の物理符号が逆=正帰還になっている場合のみtrue）

    # 停止時の電気ブレーキ（velocity モードのみ有効）。
    # true: スティック中立/停止時に目標0＋ブレーキ指令を送り、しっかり停止・保持する。
    # false: 目標0のみを送る。
    #
    # 実機評価の結果 false が最良（brake_on_stop: false + stop_resend_interval_ms: 300）。
    # 「2段階停止」の解決に効いたのはブレーキの有効化ではなく、停止フレームの再送を
    # スロットルすること（stop_resend_interval_ms、下記参照）だった。true にすると
    # 停止・保持は強くなるが、実機の体感では false のほうが良い。
    #
    # 注意: false では停止時に電気ブレーキが掛からない（ウォッチドッグ停止・非常停止も
    # 同じ経路なので同様）。傾斜面で保持が必要な運用に変える場合は true を再検討する。
    # その場合も stop_resend_interval_ms > 0 は必須（制御 tick 50Hz でブレーキを
    # 毎 tick 新規の制動として掛けると収束しない振動になる）。
    brake_on_stop: false

    # 注: ファーム側加速時間 accel_time_0p1ms_per_rpm はパラメータとしては廃止し、
    # コード内で 1（実質ファーム平滑化なし）に固定した。実機検証で 1 より大きくすると
    # 高RPMの直進が乱れることが確定しており、左右共通・前後/旋回分離不可の単一ファーム値は
    # チューニングレバーとして機能しない。加速プロファイルの整形はホスト側
    # （max_*_accel + slew_taper_band_*）に一本化する。

    # /target_twist 受信タイムアウト（制御 tick 内で判定）。
    # 指令がこの秒数途絶えたら走行モータを停止する（velocity/current 両モードで有効）。
    # 上流（uart_joy_driver/joy_gate/joy_controller）が停止しても暴走を防ぐ安全機能。
    # 0以下で無効（安全機能のため通常は無効化しないこと）。
    cmd_timeout_sec: 1.0

    # 制御ループ（制御 tick）の周期 [Hz]。twist の受信（保存のみ）と制御実行は分離されて
    # おり、スルーレート制限の dt は 1/control_rate の定数になる。これにより加速度
    # プロファイルが上流の publish レート（DualShock 20Hz / UART 50Hz）に依存しない。
    # シリアル送信もこの tick のみが行う（指令+フィードバック往復: 2モータで正常 ≈ 7ms、
    # フィードバック落ち時は最悪 ≈ 20ms）。往復時間が周期予算 1/control_rate を超えると
    # "Control tick overrun" 警告が出る。その場合は control_rate を下げる。
    control_rate: 50.0

    # 指令送信後の追加待機 [ms]。0で待機なし（既定）。
    # 応答待ち（最大10ms）が自然なコマンド間隔になるため通常は不要。
    # DDT M0602C の最小コマンド間隔が実機検証で必要と判明した場合のみ >0 を設定する。
    # 注意: >0 にするとその分コールバックがブロックされる。
    command_wait_ms: 0

    # 停止継続中のブレーキ再送間隔 [ms]。停止指令（目標0+ブレーキ）が既に送信済みの状態が
    # 続く間、この間隔未満での再呼び出しは実際のシリアル送信をスキップする。
    # 高頻度（~20Hz）でブレーキを再送し続けると、残留回転がある間は毎回新規の制動として
    # 作用し、収束せず持続的な振動（リミットサイクル）を起こすことがある
    # （cf. 停止直後の足回り振動の rosbag 解析）。0で無効（従来通り毎回送信）。
    # 停止直後の最初の1回、および緊急停止には適用されない（常に即座に送信する）。
    #
    # 実機評価で 300 が最良（brake_on_stop: false との組み合わせ）。「2段階停止」
    # （減速したあと最後だけ挙動が変わる）の主因はここだった。制御 tick は 50Hz
    # なので、0（無効）だと停止中も毎 tick 停止フレームを送り続ける。停止フレームは
    # 毎回ファーム速度ループへの新しい目標指令として作用するため、高頻度で送ると
    # ファーム側が自身の減速を完了できず、最後の収束が乱れると考えられる
    # （ファーム内部の挙動は観測できないため機序は推定）。
    #
    # 上限の目安: アイドル時のフィードバック鮮度維持もこの再送に乗る。300 なら実測の
    # 最大 age は約 0.32s で odometry の stale 判定（0.5s）に余裕があるが、400ms を
    # 超えると掛かりはじめる。
    stop_resend_interval_ms: 300

    # 実測RPMのローパスフィルタ時定数 [s]。M0602Cのフィードバック速度は量子化・振動で
    # ノイズが大きい（実機ログ: 目標一定でも実測が約1.8Hzで往復）。この値を >0 にすると
    # レポート／オドメトリ経路で使う実測RPMを一次ローパスで平滑化する。
    # 一次ローパス: filtered += dt/(tau+dt) * (raw - filtered)（可変サンプル間隔対応）。
    # 遮断周波数の目安 fc ≒ 1/(2π·tau) [Hz]。例: 0.1 -> 約1.6Hz、0.2 -> 約0.8Hz。
    # tau を大きくするほどノイズは減るが位相遅れ（応答遅れ）が増え、オドメトリの
    # 積分タイミングも遅れる。実機で 0.05〜0.2 を目安に調整する。0以下で無効（生値）。
    # 注意: このフィルタは制御ループには掛からない。current モードの PI 制御は生の実測RPMを
    # 使い続けるため、制御の位相余裕は変わらない（平滑化はレポート／オドメトリ側のみ）。
    # /drive_status の velocity_rpm と /odom の twist に反映される。
    measured_lpf_tau_sec: 0.15

    # パブリッシュ設定
    status_publish_rate: 50.0 # ステータスパブリッシュ頻度 [Hz]
    # 型付きステータス出力先（questix_msgs/DriveStatus）。契約は questix_msgs/README.md。
    # 左右モータの電流/速度/位置/fault を型付きで確認したいときはこちらを echo してください。
    typed_status_topic: "/drive_status"

    # オドメトリ出力（実測RPM由来の twist を積分し status_publish_rate 周期で publish）。
    # フィードバックが 0.5 秒以上更新されない間（非常停止・未通電を含む）は積分を止め、
    # ポーズ固定・twist ゼロで publish を継続する。
    # publish_tf: 外部 localization が odom->base_link を出す場合は false にする
    publish_tf: true
    odom_topic: "/odom"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # 統一緊急停止トピック（questix_msgs/EmergencyStop, reliable + transient_local）。
    # active=true 受信で即時停止＋twist 無視、active=false で twist 受付を再開する
    # （モータは次の指令まで停止のまま）。空文字 "" で連動無効。
    # 発行元は operation_manager（契約: questix_msgs/README.md）。
    emergency_stop_topic: "/emergency_stop"
