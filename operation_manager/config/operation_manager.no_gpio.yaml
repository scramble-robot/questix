operation_manager_node:
  ros__parameters:
    # Practice without the GPIO safety path (questix_core enable_gpio_ref:=false). No GPIO is
    # read and /gpio/controllable is not published; /emergency_stop still comes from this node
    # (active=false, reason "released (no GPIO safety path)") so that the drive, the launcher
    # and QUESTiX LAB keep their one rule: an unheard or silent /emergency_stop means stop.
    # The physical E-stop circuit (RLY1) still cuts motor power; only its ROS report is absent.
    gpio_safety_enabled: false
    emergency_stop_topic: "/emergency_stop"
