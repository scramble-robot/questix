# Operator mappings/tuning moved to questix_control_config/config/controls.*.yaml.
# joy パッケージ (joy_node) 用パラメータ
# joy_controller.launch.py から参照する。Single Source of Truth。
joy_node:
  ros__parameters:
    use_sim_time: false
    # ジョイスティックデバイス
    dev: "/dev/input/js0"
    # ボタン/軸の自動再送レート (Hz)
    autorepeat_rate: 20.0
