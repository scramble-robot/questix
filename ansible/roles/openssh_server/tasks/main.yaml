---
# OpenSSH server: the package and its service, nothing else. sshd_config, passwords, keys, the
# port and the firewall stay as Ubuntu ships them (hardening is a separate design).
#
# Ubuntu 24.04 starts sshd through socket activation: ssh.socket listens and starts ssh.service
# on the first connection, so ssh.service itself is not meant to be enabled or running while idle.
# Starting ssh.service by hand would stop ssh.socket (they conflict) and change that default, so
# this role enables and starts whichever unit Ubuntu uses as the entry point: ssh.socket when the
# package provides it, ssh.service otherwise.

- name: Manage the OpenSSH server
  when: install_openssh_server | bool
  block:
    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure and check the SSH service
      when: not ansible_check_mode
      block:
        - name: Check whether SSH uses socket activation
          ansible.builtin.stat:
            path: /usr/lib/systemd/system/ssh.socket
          register: openssh_socket_unit

        - name: Choose the SSH entry unit
          ansible.builtin.set_fact:
            openssh_unit: "{{ 'ssh.socket' if openssh_socket_unit.stat.exists else 'ssh.service' }}"

        # sshd -t needs its privilege separation directory, which ssh.service normally creates
        # at start (a runtime directory on tmpfs; same owner and mode as the package's).
        - name: Create the sshd privilege separation directory
          ansible.builtin.file:
            path: /run/sshd
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Validate the sshd configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Enable and start SSH
          ansible.builtin.systemd:
            name: "{{ openssh_unit }}"
            enabled: true
            state: started

        # The same as `systemctl is-enabled` / `systemctl is-active` for the unit.
        - name: Read the SSH unit state
          ansible.builtin.systemd:
            name: "{{ openssh_unit }}"
          register: openssh_state

        - name: Require SSH to be enabled and active
          ansible.builtin.assert:
            that:
              - openssh_state.status.UnitFileState == 'enabled'
              - openssh_state.status.ActiveState == 'active'
            fail_msg: >-
              {{ openssh_unit }}: enabled={{ openssh_state.status.UnitFileState }},
              active={{ openssh_state.status.ActiveState }}
            quiet: true
