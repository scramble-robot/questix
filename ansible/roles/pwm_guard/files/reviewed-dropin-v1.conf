[Unit]
Requires=questix_pwm_guard.service
After=questix_pwm_guard.service

[Service]
# Do not automatically re-arm after a crash or enable competition boot activation.
Restart=no
Environment=QUESTIX_ESC_CONFIG_FILE=/etc/questix_pwm_guard/esc.yaml
# Root-owned helper only validates the existing manual start request and authorizes one ARM.
ExecStartPre=+/usr/bin/python3 /opt/questix_pwm_guard/validate_manual_start.py
ExecStopPost=+/opt/questix_pwm_guard/questix_pwm_ctl low
