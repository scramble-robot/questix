---
# Default variables for robot_autostart role

target_user: "{{ ansible_user | default(ansible_env.SUDO_USER) }}"
workspace_path: "/home/{{ target_user }}/robot_ws"
ros2_distro: jazzy
ros_domain_id: 42
questix_robot_config_dir: /etc/questix_robot

# Robot mode (scripts/robot_manager/modes.py): "practice" (default, safe: the controller alone,
# started from Robot Manager), "lesson" (QUESTiX LAB with the teacher's permission, started from
# Robot Manager) or "competition" (auto-launch on boot)
robot_mode: practice

# Shipping defaults for a freshly-kitted launch.env (single source of truth for
# ansible/roles/robot_autostart/templates/launch.env.j2). A robot ships with every
# launch component off so a first boot never drives motors/LiDAR/RViz unexpectedly;
# operators opt components in explicitly. ENABLE_GPIO_REF stays true as a legacy/
# compatibility field that nothing reads: the systemd launcher passes enable_gpio_ref:=true
# in practice and competition, and questix_core defaults to a literal true (no environment
# authority). No-GPIO needs an explicit enable_gpio_ref:=false launch argument; see
# robot_autostart/README.md.
enable_lidar: false
enable_shot: false
enable_drive: false
enable_gpio_ref: true
enable_rviz: false
controller_type: dualshock

# Robot manager Web UI
# Set to true to install robot-manager GUI
install_robot_manager: false
robot_manager_src: "{{ workspace_path }}/../questix/scripts/robot_manager"
robot_manager_port: 8888
