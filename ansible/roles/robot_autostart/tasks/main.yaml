---
# Robot Autostart Setup Tasks

- name: Validate robot mode
  ansible.builtin.assert:
    that:
      - robot_mode in ['lesson', 'practice', 'competition']
    fail_msg: >-
      robot_mode must be lesson, practice or competition (scripts/robot_manager/modes.py),
      not {{ robot_mode }}
    quiet: true

- name: Create robot config directory
  ansible.builtin.file:
    path: /etc/questix_robot
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

- name: Deploy robot mode file
  ansible.builtin.copy:
    content: "{{ robot_mode }}\n"
    dest: /etc/questix_robot/mode
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
    force: false

- name: Deploy and synchronize launch environment file
  ansible.builtin.include_tasks: launch_env.yaml

- name: Create launcher script directory
  ansible.builtin.file:
    path: /opt/questix_robot
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy launcher script
  ansible.builtin.copy:
    src: questix_robot_launcher.sh
    dest: /opt/questix_robot/questix_robot_launcher.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy questix_robot systemd service
  ansible.builtin.template:
    src: questix_robot.service.j2
    dest: /etc/systemd/system/questix_robot.service
    owner: root
    group: root
    mode: "0644"
  notify: reload_systemd

- name: Enable questix_robot service
  ansible.builtin.systemd:
    name: questix_robot
    enabled: true
    # No systemd runs in the custom image build's chroot (questix_image_build).
    daemon_reload: "{{ not (questix_image_build | default(false) | bool) }}"

- name: Deploy polkit rules for passwordless service management (.rules, Ubuntu
    24.04+)
  ansible.builtin.template:
    src: 50-questix-robot.rules.j2
    dest: /etc/polkit-1/rules.d/50-questix-robot.rules
    owner: root
    group: root
    mode: "0644"

# Robot Manager Web UI (optional, skip by default)
- name: Install robot-manager Web UI
  ansible.builtin.include_tasks: robot_manager.yaml
