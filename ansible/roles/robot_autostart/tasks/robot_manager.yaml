---
# Robot Manager Web UI Installation (optional)
# Only runs when install_robot_manager is true

- name: Install python3-pip
  ansible.builtin.apt:
    name:
      - python3-pip
    state: present
    update_cache: true

- name: Copy robot-manager source to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/robot_manager/"
    dest: /tmp/robot_manager_pkg/robot_manager/
    owner: root
    group: root
    mode: "0755"

- name: Create pyproject.toml for robot-manager
  ansible.builtin.copy:
    content: |
      [build-system]
      requires = ["setuptools"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "robot_manager"
      version = "0.1.0"
      # Pinned in scripts/robot_manager/requirements.txt (shared with setup.py and the scripts).
      dynamic = ["dependencies"]

      [tool.setuptools.dynamic]
      dependencies = { file = ["robot_manager/requirements.txt"] }

      [tool.setuptools.packages.find]
      where = ["."]

      [tool.setuptools.package-data]
      robot_manager = ["static/*", "static/**/*", "requirements.txt"]
    dest: /tmp/robot_manager_pkg/pyproject.toml
    owner: root
    group: root
    mode: "0644"

# The exact versions robot_manager is tested with; see the comment in requirements.txt.
- name: Install the pinned robot-manager dependencies
  ansible.builtin.pip:
    requirements: /tmp/robot_manager_pkg/robot_manager/requirements.txt
    extra_args: "--break-system-packages --ignore-installed"
    executable: pip3

- name: Install robot-manager from local scripts directory
  ansible.builtin.pip:
    name: /tmp/robot_manager_pkg
    extra_args: "--break-system-packages --ignore-installed --no-deps"
    executable: pip3

- name: Deploy questix_robot_manager systemd service
  ansible.builtin.template:
    src: questix_robot_manager.service.j2
    dest: /etc/systemd/system/questix_robot_manager.service
    owner: root
    group: root
    mode: "0644"
  notify: reload_systemd

# QUESTiX Local (Robot Manager 管理設定 → ネットワーク). Robot Manager runs as target_user and applies
# access point changes only by starting questix_network_admin.service (polkit: start of that unit
# only, 50-questix-robot.rules), which runs this root-owned helper. Same files as
# scripts/install-robot-manager.sh and scripts/update-robot-manager.sh. The unit has no [Install]
# section and is never enabled or started here: a fresh kit keeps the access point off
# (wifi_ap_enabled keeps deciding whether setup creates it).
- name: Install the QUESTiX Local tools (DHCP for the shared mode, regulatory domain)
  ansible.builtin.apt:
    name:
      - dnsmasq-base
      - iw
    state: present

- name: Deploy the QUESTiX Local helper (root-owned)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/robot_manager/network_admin.py"
    dest: /opt/questix_robot/questix_network_admin.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy the QUESTiX Local oneshot unit (not enabled)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../systemd/questix_network_admin.service"
    dest: /etc/systemd/system/questix_network_admin.service
    owner: root
    group: root
    mode: "0644"
  notify: reload_systemd

- name: Enable and start questix_robot_manager service
  ansible.builtin.systemd:
    name: questix_robot_manager
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure Desktop directory exists
  ansible.builtin.file:
    path: "/home/{{ target_user }}/Desktop"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  become: false
  failed_when: false

- name: Deploy desktop shortcut
  ansible.builtin.copy:
    src: questix_robot_manager.desktop
    dest: "/home/{{ target_user }}/Desktop/questix_robot_manager.desktop"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  become: false
  failed_when: false

# Trust needs the desktop's metadata service (a GNOME session). Without it `gio set` fails; the
# shortcut then asks once before launching. That is not a setup failure, but it is reported as a
# warning and never shown as success: the trust is read back.
- name: Mark desktop shortcut as trusted (GNOME)
  ansible.builtin.command:
    cmd: gio set "/home/{{ target_user }}/Desktop/questix_robot_manager.desktop" metadata::trusted true
  become: true
  become_user: "{{ target_user }}"
  register: desktop_trust_set
  failed_when: false
  changed_when: false

- name: Read back the desktop shortcut trust
  ansible.builtin.command:
    cmd: gio info --attributes=metadata::trusted "/home/{{ target_user }}/Desktop/questix_robot_manager.desktop"
  become: true
  become_user: "{{ target_user }}"
  register: desktop_trust_info
  failed_when: false
  changed_when: false

- name: Record whether the desktop shortcut is trusted
  ansible.builtin.set_fact:
    desktop_shortcut_trusted: >-
      {{ desktop_trust_info.rc == 0 and 'metadata::trusted: true' in desktop_trust_info.stdout }}

- name: Warn that the desktop shortcut is not trusted
  ansible.builtin.debug:
    msg:
      - "WARNING: the Robot Manager desktop shortcut is not marked as trusted."
      - "gio set: rc={{ desktop_trust_set.rc }} {{ desktop_trust_set.stderr | default('') | trim }}"
      - "gio info: rc={{ desktop_trust_info.rc }} {{ desktop_trust_info.stderr | default('') | trim }}"
      - "Robot Manager itself is installed (http://localhost:{{ robot_manager_port }}). To trust the icon,"
      - "log in to the desktop and run: gio set ~/Desktop/questix_robot_manager.desktop metadata::trusted true"
      - "(or right-click the icon and choose Allow Launching)."
  when: not desktop_shortcut_trusted | bool
