---
# Six historical install_reviewed.sh versions wrote exactly these LF-terminated lines.
# Unknown near-matches may be administrator settings: fail before editing config.txt.
- name: Read the boot configuration before migrating reviewed PWM settings
  ansible.builtin.slurp:
    src: "{{ boot_config_path }}"
  register: rp1_pwm_existing_config

- name: Refuse unrecognized GPIO13 PWM configuration lines
  ansible.builtin.assert:
    that:
      - rp1_pwm_related_lines | difference(rp1_pwm_known_lines) | length == 0
    fail_msg: >-
      Unrecognized GPIO13 PWM setting or reviewed annotation; config.txt was not changed.
      Review the custom line before retrying the migration.
    quiet: true
  vars:
    rp1_pwm_related_lines: >-
      {{ (rp1_pwm_existing_config.content | b64decode).splitlines()
         | select('search', '(?i)questix-gpio13-(?:rp1-)?pwm|QUESTiX reviewed GPIO13 PWM0 channel 1') | list }}
    rp1_pwm_known_lines:
      - dtoverlay=questix-gpio13-pwm
      - dtoverlay=questix-gpio13-rp1-pwm
      - '# QUESTiX reviewed GPIO13 PWM0 channel 1'

- name: Remove the exact reviewed annotation immediately before its legacy overlay
  ansible.builtin.replace:
    path: "{{ boot_config_path }}"
    regexp: '(?m)^# QUESTiX reviewed GPIO13 PWM0 channel 1\n(?=dtoverlay=questix-gpio13-pwm(?:\n|$))'
    replace: ''
    backup: true
  notify: reboot_required

- name: Remove only exact legacy GPIO13 overlay lines
  ansible.builtin.lineinfile:
    path: "{{ boot_config_path }}"
    regexp: '^dtoverlay=questix-gpio13-pwm$'
    state: absent
    backup: true
  notify: reboot_required

# Retain every [all] and the unreferenced old .dtbo as migration evidence.
- name: Keep the standard GPIO13 overlay in an explicit all section
  ansible.builtin.blockinfile:
    path: "{{ boot_config_path }}"
    marker: "# {mark} QUESTiX RP1 PWM"
    insertafter: EOF
    block: |
      [all]
      dtoverlay=questix-gpio13-rp1-pwm
  register: rp1_pwm_config
  notify: reboot_required
