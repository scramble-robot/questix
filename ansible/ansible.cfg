[defaults]
# Used by the custom image build from the image's own checkout (/home/ubuntu/questix/ansible,
# scripts/apply-ansible-config.sh): roles resolve next to this file.
roles_path = roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = memory
