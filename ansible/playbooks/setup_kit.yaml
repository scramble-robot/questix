---
# Robotics Kit Setup Playbook (ARM64 - Raspberry Pi 5)
# This playbook sets up ROS2 robotics kit environment on ARM64 Raspberry Pi 5

- name: Setup ROS2 Robotics Kit Environment for Raspberry Pi 5 (ARM64)
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars/setup_kit_vars.yaml

  pre_tasks:
    - name: Verify target architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "aarch64"
        fail_msg: "This playbook is designed for ARM64/aarch64 architecture only. Current: {{ ansible_architecture }}"
        success_msg: "Architecture verification passed: {{ ansible_architecture }}"

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "Target Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "ROS2 Distribution: {{ ros2_distro }}"
          - "Target: Raspberry Pi 5 Robotics Kit"

    - name: Check Ubuntu version compatibility for Raspberry Pi 5
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == target_ubuntu_version
        fail_msg: >-
          This playbook is optimized for Ubuntu {{ target_ubuntu_version }} on
          Raspberry Pi 5. Current: {{ ansible_distribution }}
          {{ ansible_distribution_version }}
        success_msg: >-
          Ubuntu version check passed: {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Check if running on Raspberry Pi
      ansible.builtin.shell: |
        if [ -f /proc/device-tree/model ]; then
          cat /proc/device-tree/model
        else
          echo "Unknown"
        fi
      register: pi_model
      changed_when: false

    - name: Display Raspberry Pi model
      ansible.builtin.debug:
        msg: "Detected device: {{ pi_model.stdout }}"

    - name: Validate ROS_DOMAIN_ID before any state-changing role runs
      ansible.builtin.include_tasks: tasks/validate_ros_domain_id.yaml

  roles:
    - { role: ros2_installation }
    - { role: raspberry_pi_setup }
    - { role: hardware_interfaces }
    - { role: robotics_workspace }
    # Imports dependency.repos, runs rosdep and colcon build, and checks the packages resolve:
    # the kit is not usable (Robot Manager's lesson bridge, the robot service) until it is built.
    - { role: ros2_build }
    - { role: robot_autostart }
    - { role: display_settings }
    # Off unless wifi_ap_enabled: switching the Wi-Fi to AP mode drops a Wi-Fi client connection.
    - { role: wifi_access_point, when: wifi_ap_enabled | bool }
    # Last: removes the legacy .pkla and the old image's NOPASSWD:ALL sudoers file (exact matches).
    - { role: legacy_privilege_cleanup }

  post_tasks:
    # Reached only when every role succeeded, including ros2_build's package checks: the
    # workspace is built, not just created. Check mode (the CI dry run) builds nothing.
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - >-
            {{ '🤖 ROS2 robotics kit environment setup completed for Raspberry Pi 5!'
            if workspace_build_ready | default(false) | bool
            else '🧪 Check mode: nothing was built; the kit is NOT set up' }}
          - >-
            {{ '🏗️  Workspace built at: ' ~ workspace_path
            ~ ' (dependency.repos imported, rosdep installed, colcon build --symlink-install)'
            if workspace_build_ready | default(false) | bool
            else '🏗️  Workspace NOT built: ' ~ workspace_path }}
          - >-
            {{ '📦 QUESTiX ROS packages ready: ' ~ (workspace_required_packages | default([]) | join(', '))
            ~ ' (questix_lab_bridge lab_bridge_node resolves)'
            if workspace_build_ready | default(false) | bool else '📦 QUESTiX ROS packages: not checked' }}
          - "🖥️  Robot Manager installed: http://localhost:{{ robot_manager_port | default(8888) }}"
          - >-
            {{ '🖱️  Desktop shortcut trusted' if desktop_shortcut_trusted | default(false) | bool
            else '⚠️  Desktop shortcut not trusted (see the warning above; Robot Manager works without it)' }}
          - "🔧 Robotics development tools installed"
          - "🔌 GPIO, I2C, and SPI interfaces enabled"
          - "📝 Environment aliases added to .bashrc"
          - "⚙️  Hardware udev rules configured"
          - "🚀 Robot autostart service installed (mode: {{ robot_mode }})"
          - "   Change mode: echo competition | sudo tee /etc/questix_robot/mode"
          - ""
          - "Next steps:"
          - "1. Reboot the system: sudo reboot"
          - "2. Source your bashrc: source ~/.bashrc"
          - "3. Navigate to workspace: rw"
          - "4. Show the GPIO lines (read-only): gpio_status"
          - "5. Test ROS2: ros2 topic list"
          - "6. Switch to competition mode: echo competition | sudo tee /etc/questix_robot/mode"
