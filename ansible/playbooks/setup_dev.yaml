---
# Development Environment Setup Playbook (AMD64)
# This playbook sets up ROS2 development environment on AMD64 architecture

- name: Setup ROS2 Development Environment for AMD64
  hosts: all
  become: true
  gather_facts: true
  vars:
    ros2_distro: jazzy
    target_architecture: amd64
    install_dev_tools: true
    ros2_additional_packages:
      - ros-jazzy-example-interfaces
      - ros-jazzy-demo-nodes-cpp
      - ros-jazzy-demo-nodes-py
      - ros-jazzy-rqt*
      - ros-jazzy-rviz2
      - python3-colcon-common-extensions
      - python3-rosdep
      - python3-vcstool
      - python3-argcomplete

  pre_tasks:
    - name: Get connection user (no become)
      ansible.builtin.command: whoami
      register: conn_user_whoami
      become: false
      changed_when: false

    - name: Set connection user fact
      ansible.builtin.set_fact:
        conn_user_name: "{{ conn_user_whoami.stdout }}"

    - name: Look up connection user home directory via getent
      ansible.builtin.getent:
        database: passwd
        key: "{{ conn_user_name }}"

    - name: Set connection user home directory fact
      ansible.builtin.set_fact:
        conn_user_home: "{{ ansible_facts.getent_passwd[conn_user_name][4] }}"

    - name: Ensure connection user home is under /home
      ansible.builtin.assert:
        that:
          - conn_user_home is defined
          - conn_user_home is match('^/home/.+')
        fail_msg: >-
          conn_user_home must be under /home/. Got: {{ conn_user_home | default('<undefined>') }}
          (user: {{ conn_user_name }}). Run this playbook as a regular user (with sudo for become),
          not as root.
        success_msg: "Connection user home resolved: {{ conn_user_home }} ({{ conn_user_name }})"

    - name: Verify target architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "This playbook is designed for AMD64/x86_64 architecture only. Current: {{ ansible_architecture }}"
        success_msg: "Architecture verification passed: {{ ansible_architecture }}"

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "Target Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "ROS2 Distribution: {{ ros2_distro }}"

    - name: Check Ubuntu version compatibility
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: >-
          This playbook requires Ubuntu 24.04 for ROS2 Jazzy.
          Current: {{ ansible_distribution }} {{ ansible_distribution_version }}
        success_msg: >-
          Ubuntu version check passed: {{ ansible_distribution }}
          {{ ansible_distribution_version }}

  roles:
    - role: ros2_installation
      vars:
        ros2_install_dev_tools: "{{ install_dev_tools }}"

  post_tasks:
    - name: Install development utilities
      ansible.builtin.apt:
        name:
          - git
          - wget
          - curl
          - vim
          - htop
          - tree
          - build-essential
          - cmake
          - gdb
          - valgrind
        state: present
        update_cache: true

    - name: Add ROS2 workspace setup to bashrc
      ansible.builtin.lineinfile:
        path: "{{ conn_user_home }}/.bashrc"
        line: "{{ item }}"
        state: present
        create: true
      become: false
      loop:
        - "# ROS2 Development Environment"
        - "export ROS_DOMAIN_ID=42"
        - "export COLCON_WS={{ conn_user_home }}/ros2_ws"
        - "alias cw='cd $COLCON_WS'"
        - "alias cs='cd $COLCON_WS/src'"
        - "alias cb='cd $COLCON_WS && colcon build'"
        - "alias ct='cd $COLCON_WS && colcon test'"

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "✅ ROS2 development environment setup completed!"
          - "🔧 Development tools installed"
          - "📝 Environment aliases added to ~/.bashrc for {{ conn_user_name }}"
          - ""
          - "Next steps:"
          - "1. Source your bashrc: source ~/.bashrc"
          - "2. Create your workspace: mkdir -p ~/ros2_ws/src"
          - "3. Test installation: ros2 topic list"
