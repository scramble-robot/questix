---
# Source-only harness for the openssh_server role switched off: it must do nothing at all
# (no package, no service change, no sshd_config), so it runs without root. See
# run_contract_tests.sh.

- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    install_openssh_server: false
  tasks:
    - name: Exercise openssh_server tasks with install_openssh_server=false
      ansible.builtin.include_role:
        name: openssh_server
