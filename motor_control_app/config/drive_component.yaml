drive_component:
  ros__parameters:
    # シリアル通信設定
    serial_port: "/dev/ttyACM0"
    baud_rate: 57600

    # ロボット物理パラメータ
    wheel_radius: 0.1 # ホイール半径 [m]
    wheel_separation: 0.5 # ホイール間隔 [m]

    # モータ設定
    left_motor_id: 4 # 左モータID
    right_motor_id: 5 # 右モータID
    # 走行モータの上限回転数
    # 値を下げるとロボット全体の最高速度が下がります。組立直後の安全確認では低めを推奨します。
    max_motor_rpm: 1000 # 最大RPM

    # 制御モード設定
    # "velocity": M0602Cファーム内蔵の速度ループを使用（従来挙動）
    # "current" : ソフトウェアPI制御で目標RPM→電流指令に変換（精密操縦向け）
    control_mode: "current"
    current_kp: 0.001            # [A/rpm]   比例ゲイン（発振したら下げる）
    current_ki: 0.0              # [A/(rpm·s)] 積分ゲイン（純Pで安定確認後に上げる）
    max_current_amp: 1.0         # [A] 電流指令の絶対値上限（安全クランプ）
    integral_limit_amp: 0.3      # [A] 積分項寄与の絶対値上限（アンチワインドアップ）
    current_zero_deadband_rpm: 5 # [RPM] 目標0かつ実測がこの範囲内ならPIを停止して積分リセット（静止時の微振動防止）

    # パブリッシュ設定
    status_publish_rate: 10.0 # ステータスパブリッシュ頻度 [Hz]
    # 左右モータのフィードバック出力先
    # 左右RPMや現在速度を見たいときは、このトピックを ros2 topic echo してください。
    status_topic: "/drive_motor_status"
