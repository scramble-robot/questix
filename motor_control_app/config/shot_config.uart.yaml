shot_component:
  ros__parameters:
    # Joy input topic
    joy_topic: "/joy"

    port: "/dev/servo"
    baudrate: 115200
    tilt_servo_id: 11
    trigger_servo_id: 10
    # Disc fire button / ディスク射出ボタン
    # Switch2 (uart_joy_driver) native index: R = 5
    fire_button: 5
    fire_duration_ms: 300
    # Tilt input mode
    # Switch2: D-pad vertical = axis 7
    tilt_axis: 7
    # Switch2 native indices: L = 4 (up), ZL = 6 (down)
    tilt_up_button_index: 4
    tilt_down_button_index: 6
    fire_angle: 145.0
    home_angle: 245.0
    tilt_max_angle: 120.0
