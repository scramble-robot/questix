shot_component:
  ros__parameters:
    # Joy input topic
    joy_topic: "/joy"

    # Lifecycle auto start / ライフサイクル自動起動
    # 非常停止中はサーボが通電されず接続できないため、unconfigured で待機し
    # connect_retry_period_sec 間隔で接続を再試行、成功したら自動で activate する。
    auto_start: true
    connect_retry_period_sec: 3.0

    # E-stop linkage / 非常停止連動（auto_start=true のときのみ有効）
    # operation_manager が配信する /gpio/controllable を購読し、
    # 非常停止解除 (false→true) で即時に configure→activate、
    # 押下 (true→false) で deactivate→cleanup してサーボ接続を解放する。
    # トピック未受信の環境（enable_gpio_ref=false 等）では
    # connect_retry_period_sec の周期リトライにフォールバックする。
    # "" で連動無効（周期リトライのみ）。
    controllable_topic: "/gpio/controllable"
    controllable_timeout_sec: 1.0  # <= 0 disables stale-signal fail-safe

    port: "/dev/servo"
    baudrate: 115200
    tilt_servo_id: 11
    trigger_servo_id: 10
    # Disc fire button / ディスク射出ボタン
    # DualShock standard mapping: R1 = 5
    fire_button: 5
    fire_duration_ms: 300
    # Tilt input mode
    # DualShock: D-pad vertical = axis 7 (joy_node)
    tilt_axis: 7
    # DualShock: L1 = 4, L2 = 6
    tilt_up_button_index: 4
    tilt_down_button_index: 6
    fire_angle: 145.0
    home_angle: 245.0
    tilt_max_angle: 120.0
