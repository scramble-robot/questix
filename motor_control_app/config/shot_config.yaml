# The controller's fire and tilt buttons are joy_launcher's (questix_control_config/config/
# controls.*.yaml, joy_launcher section): this node reads /launcher_command only.
shot_component:
  ros__parameters:
    # questix_msgs/LauncherCommand (fire_seq, tilt_steps, tilt_deg): joy_launcher in practice and
    # competition, command_arbiter (the controller or QUESTiX LAB) in a lesson. Who may command
    # the launcher is decided there, never here. While more than one node publishes it, fire and
    # tilt are refused (their counters would mix).
    launcher_command_topic: "/launcher_command"

    # Lifecycle auto start / ライフサイクル自動起動
    # 非常停止中はサーボが通電されず接続できないため、unconfigured で待機し
    # connect_retry_period_sec 間隔で接続を再試行、成功したら自動で activate する。
    # false にすると ros2 lifecycle set で手動遷移する運用になる（手動 configure は待たずに
    # サーボへ 1 回だけ問い合わせ、応答がなければ失敗する。操作者が再度要求する）。
    auto_start: true
    connect_retry_period_sec: 3.0
    # 起動の試行期間 (issue #175, auto_start=true のときのみ)。非常停止の解除・教員の許可・
    # 構成の成功から startup_window_sec の間、startup_retry_period_sec ごとに configure
    # (接続 + サーボ 1 回の応答確認) と activate を 1 段ずつ試す。解除のコールバックでは待たない
    # ので、通電直後のサーボ無応答の間も /emergency_stop の受信処理は止まらない。期限後は
    # connect_retry_period_sec の周期リトライに戻る (WARN 1 行)。範囲外は 0.05..1.0 s / 0.5..60 s。
    startup_retry_period_sec: 0.2
    startup_window_sec: 5.0
    # サーボの応答待ちの上限 [ms] (すべての送受信: 応答確認・home・チルト・射撃)。10..500 に制限。
    # 送受信 1 回の所要は、これに RS485 切替の固定待ち約 7.5 ms を足した程度が上限になる。
    servo_response_timeout_ms: 100

    # E-stop linkage / 非常停止連動（auto_start=true のときのみ有効）
    # operation_manager が配信する /emergency_stop（questix_msgs/EmergencyStop,
    # reliable + transient_local。契約: questix_msgs/README.md）を購読し、
    # 非常停止解除 (active true→false) で起動の試行期間を始め (上記)、
    # 押下 (active false→true) で deactivate→cleanup してサーボ接続を解放する。
    # require_emergency_stop: true では、トピック未受信の間も非常停止として扱い、接続・射撃・
    # チルトをしない（operation_manager は questix_core で常に起動し、GPIO 安全系なしでも
    # "released (no GPIO safety path)" を出す）。false は単体診断の明示 opt-out のみで、
    # そのときだけ未受信の環境で connect_retry_period_sec の周期リトライにフォールバックする。
    emergency_stop_topic: "/emergency_stop"
    emergency_stop_timeout_sec: 1.0  # 受信途絶でfail-safe teardownするまでの秒数（0以下で無効）
    require_emergency_stop: true
    # 走行許可（L2、/motion_permission の launcher_allowed、reliable + volatile）は非常停止とは
    # 別の概念で、operation_manager の MotionPermissionManager がモードごとの票（大会: 審判 GPIO27、
    # 教材: 先生の許可、練習: なし）をまとめたもの。許可がない間は自動起動（ホーム移動）を保留し、
    # 射撃・チルトを断る。ACTIVE 中に切れたら射撃中のシーケンスだけ止めて home に戻し、サーボバスは
    # 保持する（電源は入ったまま。理由は /shot/status の permission で非常停止と区別）。
    # require_motion_permission: false は単体診断の明示 opt-out のみ（統合起動では使わない）。
    motion_permission_topic: "/motion_permission"
    require_motion_permission: true
    motion_permission_timeout_sec: 0.5

    # min_fire_interval_sec: 射出は直前の射出からこの秒数以上あける (機構の制限、0 で制限なし)。
    #   QUESTiX LAB の射出間隔 (2 s) は command_arbiter の fire_interval_sec。
    #   The mechanism's shortest time between two shots; QUESTiX LAB's interval is command_arbiter's.
    #   射撃・チルトは ACTIVE・走行許可あり・非常停止解除のときだけ動き、それ以外で届いた指令は溜めない。
    # 状態は /shot/status (std_msgs/String, JSON, 5 Hz と変化時) に常に出る。
    # Status: /shot/status (JSON, 5 Hz and on change), published in every state.
    min_fire_interval_sec: 0.0

    port: "/dev/servo"
    baudrate: 115200
    tilt_servo_id: 11
    trigger_servo_id: 10
    fire_duration_ms: 300 # 射撃持続時間（ミリ秒）
    fire_angle: 145.0 # 射撃角度（度）
    home_angle: 245.0 # ホーム角度（度）
    tilt_max_angle: 120.0 # チルト最大角度（度）
