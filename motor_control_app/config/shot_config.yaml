shot_component:
  ros__parameters:
    # Joy input topic
    joy_topic: "/joy"

    # Lifecycle auto start / ライフサイクル自動起動
    # 非常停止中はサーボが通電されず接続できないため、unconfigured で待機し
    # connect_retry_period_sec 間隔で接続を再試行、成功したら自動で activate する。
    # false にすると ros2 lifecycle set で手動遷移する運用になる。
    auto_start: true
    connect_retry_period_sec: 3.0

    # E-stop linkage / 非常停止連動（auto_start=true のときのみ有効）
    # operation_manager が配信する /emergency_stop（questix_msgs/EmergencyStop,
    # reliable + transient_local。契約: questix_msgs/README.md）を購読し、
    # 非常停止解除 (active true→false) で即時に configure→activate、
    # 押下 (active false→true) で deactivate→cleanup してサーボ接続を解放する。
    # トピック未受信の環境（enable_gpio_ref=false 等）では
    # connect_retry_period_sec の周期リトライにフォールバックする。
    # "" で連動無効（周期リトライのみ）。
    # ※ joy_gate は従来どおり /gpio/controllable を購読する。
    emergency_stop_topic: "/emergency_stop"
    emergency_stop_timeout_sec: 1.0  # 受信途絶でfail-safe teardownするまでの秒数（0以下で無効）

    # QUESTiX LAB launcher input / QUESTiX LAB からのチルト・射出
    # accept_lab_input: true のときだけ /shot/lab/tilt (std_msgs/Float32, 目標チルト角 [deg],
    #   tilt_min_angle..tilt_max_angle に制限) と /shot/lab/fire (std_msgs/Empty, 1発射出) を
    #   購読する。練習用の起動 (questix_core.launch.xml, enable_autoreferee=false) だけが launch
    #   引数で true にする。競技 (AutoReferee) では常に false。既定値はこの YAML の false。
    #   Subscribed only when true; only practice launches set it (never competition).
    #   lab の要求は ACTIVE・非常停止解除・射撃中でないときだけ適用し、断った要求は溜めない。
    #   Lab requests apply only while ACTIVE, E-stop released and not shooting; never queued.
    # lab_joy_quiet_sec: コントローラの射出ボタン・チルト入力が最後に使われてからこの秒数は
    #   lab の要求を受け付けない (コントローラ優先)。
    #   The controller's fire button and tilt input must be idle this long.
    # lab_min_fire_interval_sec: lab の射出は直前の射出 (コントローラ含む) からこの秒数以上あける。
    #   Minimum time between the last shot (any source) and a lab shot.
    # 状態は /shot/status (std_msgs/String, JSON, 5 Hz と変化時) に常に出る。
    # Status: /shot/status (JSON, 5 Hz and on change), published regardless of this setting.
    accept_lab_input: false
    lab_joy_quiet_sec: 1.0
    lab_min_fire_interval_sec: 2.0

    port: "/dev/servo"
    baudrate: 115200
    tilt_servo_id: 11
    trigger_servo_id: 10
    # Disc fire button / ディスク射出ボタン
    # Switch2 (uart) native index: R = 5 / DualShock: R1 = 5
    fire_button: 5
    fire_duration_ms: 300 # 射撃持続時間（ミリ秒）
    # Tilt input mode / チルト入力モード
    # - tilt_axis >= 0 : use that analog axis (e.g. D-pad vertical = 7).
    # - tilt_axis < 0  : use tilt_up_button_index / tilt_down_button_index (button mode).
    # 軸で動かしたいときは tilt_axis に軸番号を、ボタンで動かしたいときは
    # tilt_axis: -1 にして下の button_index を使ってください。
    tilt_axis: 7
    # Switch2 native indices: L=4 (up), ZL=6 (down)
    tilt_up_button_index: 4
    tilt_down_button_index: 6
    fire_angle: 145.0 # 射撃角度（度）
    home_angle: 245.0 # ホーム角度（度）
    tilt_max_angle: 120.0 # チルト最大角度（度）
